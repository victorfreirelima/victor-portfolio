<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc"><title id="title">Soficom Cloud — Clareza nas ações da atividade</title><desc id="desc">Representação explicativa — não é captura da interface.</desc><rect width="1000" height="625" fill="#EDF2F6"/><text x="70" y="75" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#475569">SOFICOM CLOUD</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#121419">Clareza nas ações da atividade</text><rect x="70" y="160" width="860" height="98" rx="12" fill="white" stroke="#CBD5E1"/><circle cx="110" cy="208" r="17" fill="#121419"/><text x="110" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="white">1</text><text x="150" y="200" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#121419">Cadastrar profissional</text><text x="150" y="229" font-family="Arial,sans-serif" font-size="18" fill="#475569">Disponibilizar o cadastro, se necessário.</text><rect x="70" y="278" width="860" height="98" rx="12" fill="white" stroke="#CBD5E1"/><circle cx="110" cy="326" r="17" fill="#121419"/><text x="110" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="white">2</text><text x="150" y="318" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#121419">Atribuir à atividade</text><text x="150" y="347" font-family="Arial,sans-serif" font-size="18" fill="#475569">Identificar o contabilista responsável.</text><rect x="70" y="396" width="860" height="98" rx="12" fill="white" stroke="#CBD5E1"/><circle cx="110" cy="444" r="17" fill="#121419"/><text x="110" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="white">3</text><text x="150" y="436" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#121419">Concluir atividade</text><text x="150" y="465" font-family="Arial,sans-serif" font-size="18" fill="#475569">Comunicar a conclusão da tarefa.</text><text x="70" y="575" font-family="Arial,sans-serif" font-size="17" fill="#475569">Representação explicativa — não é captura da interface.</text></svg>